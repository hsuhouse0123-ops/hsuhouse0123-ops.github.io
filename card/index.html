<script>
  // 공유: 휴대폰은 공유 시트, 안 되면 링크 복사
  document.getElementById('share').addEventListener('click', async () => {
    const url = 'https://hongeui.com/card/';
    const note = document.getElementById('share-note');
    if (navigator.share) {
      try { await navigator.share({ title: 'HONG EUI', text: 'Outdoor Photographer & Filmmaker', url }); } catch (e) {}
      return;
    }
    try { await navigator.clipboard.writeText(url); note.textContent = '링크 복사됨'; }
    catch (e) { note.textContent = url; }
  });
